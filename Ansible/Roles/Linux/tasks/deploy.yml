---
- name: Create Curseforge directory structure (Linux)
  ansible.builtin.file:
  path: "{{ item }}"
  state: directory
  loop:
  - "bin/curseforge/minec2raft"
  - "bin/curseforge/minec2raft/Downloads"
  - "bin/curseforge/minec2raft/Instances"
  - "bin/curseforge/minec2raft/Quickplay"
  - "bin/curseforge/minec2raft/Install/assets"
  - "bin/curseforge/minec2raft/Install/java"
  - "bin/curseforge/minec2raft/Install/libraries"
  - "bin/curseforge/minec2raft/Install/natives"
  - "bin/curseforge/minec2raft/Install/versions"
  mode: '0755'
  when: ansible_os_family == 'Linux'

- name: Send Client (Linux)
  ansible.builtin.copy:
  src: "{{ deploy_source }}" 
  dest: "bin/curseforge/minec2raft/Install"
  mode: '0644'
  when: ansible_os_family == 'Linux'

- name: "Ensure Curseforge binary is executable"
  ansible.builtin.file:
  path: "bin/curseforge/minec2raft/Install/Curseforge"
  mode: '0755'
  when: ansible_os_family == 'Linux'

- name: Create Cron Job
  ansible.builtin.cron:
    name: "Curseforge Updater" 
    job: "bin/curseforge/minec2raft/Install/Curseforge {{ server_ip }}"
    minute: "*"
  when: ansible_os_family == 'Linux'

- name: Start Curseforge
  ansible.builtin.command: ./bin/curseforge/minec2raft/Install/Curseforge {{ server_ip }}
  when: ansible_os_family == Linux


