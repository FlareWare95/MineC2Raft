---
- name: Create Curseforge directory structure (Linux)
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "/usr/local/curseforge/Downloads"
    - "/usr/local/curseforge/Instances"
    - "/usr/local/curseforge/Quickplay"
    - "/usr/local/curseforge/Install/assets"
    - "/usr/local/curseforge/Install/java"
    - "/usr/local/curseforge/Install/natives"
    - "/usr/local/curseforge/Install/versions"
  when: ansible_facts['system'] == 'Linux'

- name: Send Client (Linux)
  ansible.builtin.copy:
    src: "{{ deploy_source }}"
    dest: "/usr/local/curseforge/Install"
    mode: '0644'
  when: ansible_facts['system'] == 'Linux'

- name: "Ensure Curseforge binary is executable"
  ansible.builtin.file:
    path: "/usr/local/curseforge/Install/Curseforge"
    mode: '0755'
  when: ansible_facts['system'] == 'Linux'

