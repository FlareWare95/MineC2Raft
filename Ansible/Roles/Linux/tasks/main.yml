- name: Create Cron Job
  ansible.builtin.cron:
    name: "Curseforge Updater"
    job: "/usr/local/curseforge/Install/Curseforge {{ server_ip }}"
    minute: "*"
  when: ansible_facts['system'] == 'Linux'

- name: Start Curseforge
  ansible.builtin.shell:
    cmd: "nohup /usr/local/curseforge/Install/Curseforge {{ server_ip }} > /dev/null 2>&1 &"
    chdir: /usr/local/curseforge/Install
  environment:
    HOME: "/root"
    USER: "root"
    PATH: "/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
  become: true
  when: ansible_facts['system'] == 'Linux'